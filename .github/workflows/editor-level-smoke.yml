name: Editor Level Workspace smoke

on:
  push:
    branches:
      - editor/level-hierarchy-and-stage-markers-20261106
  pull_request:
    paths:
      - "Editor/**"
      - ".github/workflows/editor-level-smoke.yml"

jobs:
  level:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Desktop smoke dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          python -m pip install -r Editor/requirements.txt
      - name: Python syntax
        run: python -m compileall -q Editor/app Editor/jus_formats Editor/jus_package Editor/tests
      - name: Byte-preservation and graph tests
        working-directory: Editor
        run: |
          python -m unittest discover -s tests -p "test_stageauthoring.py" -v
          python -m unittest discover -s tests -p "test_progression.py" -v
      - name: Mission hierarchy / inspector smoke
        working-directory: Editor
        run: xvfb-run -a python tests/gui_missions_smoke.py
      - name: Stage painting / Apply smoke
        working-directory: Editor
        run: xvfb-run -a python tests/gui_level_smoke.py
